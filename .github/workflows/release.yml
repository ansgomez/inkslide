name: Release

# A tag v<version> builds the desktop packages on Linux, Windows and macOS and
# publishes them as a GitHub release. Run by hand (Actions → Release → Run
# workflow) it only builds them and keeps them as workflow artifacts.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: --linux AppImage rpm
          - os: windows-latest
            args: --win nsis
          - os: macos-latest
            args: --mac dmg --arm64 --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # No dependency cache: a cache that other runs can write to could
          # put tampered packages into the release.
          package-manager-cache: false
      - name: Check that the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - name: Install rpmbuild
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @inkslide/web build
      - name: Package
        shell: bash
        env:
          # Unsigned builds: no code signing certificate is used.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: node apps/desktop/scripts/dist.mjs ${{ matrix.args }} --publish never
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inkslide-${{ runner.os }}
          if-no-files-found: error
          path: |
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.rpm
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.dmg

  release:
    needs: build
    # Only a pushed tag publishes; a manual run only builds, also on a tag.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-files
          merge-multiple: true
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd release-files && sha256sum * > SHA256SUMS.txt)
          # A re-run (or a release made by hand first) replaces the files.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-files/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-files/* \
              --title "Inkslide ${GITHUB_REF_NAME#v}" \
              --notes-file .github/release-notes.md \
              --prerelease
          fi
