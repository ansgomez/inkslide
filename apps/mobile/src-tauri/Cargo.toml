[package]
name = "inkslide"
version = "0.1.0"
description = "Annotate PDFs with a pen (Inkslide for iPad and Android)"
authors = ["Andres Gomez"]
license = "MIT"
edition = "2021"
rust-version = "1.90"
publish = false

# Mobile builds link the library (staticlib on iOS, cdylib on Android);
# main.rs only runs it on the desktop (development).
[lib]
name = "inkslide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
tauri-plugin-fs = "2.7"
tauri-plugin-sharekit = "0.3.1"
# File bytes from Android, where the IPC has no raw bodies (already in the tree through Tauri).
base64 = "0.23"
serde_json = "1"

[profile.dev]
opt-level = 1

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
